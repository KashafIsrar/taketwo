server:
  port: 8080

spring:
  application:
    name: taketwo-backend

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taketwo_db}
    username: ${DB_USERNAME:taketwo_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# --- TAKETWO-specific config ---
taketwo:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-this-is-not-secure}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  tmdb:
    api-key: ${TMDB_API_KEY:ea2f280500d60c08d68d2a4e51dbf702}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p

logging:
  level:
    com.taketwo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG