server:
  port: 8080

spring:
  application:
    name: taketwo-backend

  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taketwo_db}
    username: ${DB_USERNAME:taketwo_app}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' for local dev only. Use 'validate' once we introduce
      # Flyway/Liquibase migrations in a later phase - never 'update' in prod.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# --- TAKETWO-specific config ---
taketwo:
  jwt:
    # Overridden via env var in every real environment. This default is
    # for local dev only and must never be used in staging/prod.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-this-is-not-secure}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h access token

  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: https://api.themoviedb.org/3
    image-base-url: https://image.tmdb.org/t/p

logging:
  level:
    com.taketwo: INFO
    org.springframework.security: INFO
    # Flip to DEBUG temporarily to see exactly which filter/rule denies a
    # request - the log line names the matched AuthorizationManager decision.
    # org.springframework.security: DEBUG

